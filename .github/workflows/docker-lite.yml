name: Docker Lite

# 手动触发；推 v* tag 时也构建
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（留空则 lite）"
        required: false
        default: "lite"
      platforms:
        description: "构建平台，逗号分隔（amd64 约 8 分钟；加 arm64 需 QEMU 模拟，明显更慢）"
        required: false
        default: "linux/amd64"
  push:
    tags:
      - "v*"

concurrency:
  group: docker-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write      # 推 ghcr.io 需要

env:
  IMAGE: ghcr.io/${{ github.repository }}/weknora-lite

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # IM adapters this fork patches; keeps a broken adapter out of the image.
      - run: go test ./internal/im/dingtalk/

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name, tag and platforms
        id: meta
        run: |
          IMAGE=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="lite"; fi
          fi
          PLATFORMS="${{ inputs.platforms }}"
          if [ -z "$PLATFORMS" ]; then PLATFORMS="linux/amd64"; fi
          echo "image=$IMAGE"         >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE:$TAG for $PLATFORMS"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.lite
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
